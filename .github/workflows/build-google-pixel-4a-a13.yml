name: Build Google Pixel 4a (Sunfish)

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - mainline
    paths:
      - '.github/workflows/build-google-pixel-4a-a13.yml'
  
env:
  # Device env
  DEVICE_NAME : "google_pixel_4a"
  DEVICE_CODENAME : "sunfish"

  CUSTOM_CMDS : "CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CROSS_COMPILE_COMPAT=arm-linux-gnueabi-"
  EXTRA_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf HOSTCC=clang HOSTCXX=clang++"

  KERNEL_SOURCE : "https://github.com/engstk/pxl4a"
  KERNEL_BRANCH : "blu_spark-13"

  # Proton Clang (Clang 13)
  CLANG_SOURCE : "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH : "master"

  GCC_GNU : true
  GCC_64_SOURCE : ""
  GCC_64_BRANCH : ""
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "sunfish_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # KernelSU & SuSFS Setup
  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""
  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu" # ReSukiSU is highly recommended for SuSFS compatibility

  SUSFS_ENABLE : "true"           # Enabled SuSFS
  SUSFS_FIXED : "true"           # Leave false initially; see the troubleshooting note below

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"
  BOOT_SOURCE : ""
  NEED_DTBO : false
  NEED_SAFE_DTBO : false
  ROM_TEXT : "stock_a13"
  PYTHON_VERSION: "3" 
  PACK_METHOD: "Anykernel3" 
  PACK_KMODULES: "false" 
  KERNELSU_METHOD: "shell" 
  PATCHES_SOURCE: "ayusc/NonGKI_Kernel_Patches" 
  PATCHES_BRANCH: "pixel_kernel" 

  # If you put the patch in a specific folder in your repo (e.g., 'pixel_4a_a13'), specify it here. Leave blank if it's in the root directory.
  SUSFS_FOLDER_FIXED: "pixel_4a" 
  
  # The name of your patch file without the '.patch' extension. 
  # E.g., if your file is 'susfs_pixel4a_fixed.patch', put 'susfs_pixel4a_fixed' here.
  SUSFS_PATCH_FIXED: "susfs_sunfish_fixed"

  # Re:Kernel
  REKERNEL_ENABLE: "true"         # Enabled Re:Kernel
  DROIDSPACES_ENABLE: "false" 
  HOOK_METHOD: "syscall" 
  KERNEL_PATCH: "false" 
  KPM_ENABLE: "false" 
  KPM_INLINE: "false" 
  KPM_KPATCH_NEXT: "false" 
  KPM_PATCH_SOURCE: "" 

  # Baseband Guard
  BASEBAND_GUARD_ENABLE: "true"   # Enabled Baseband Guard
  BASEBAND_GUARD_BOOT: "false"    # Leave false unless you specifically want to block the baseband immediately at boot

  GENERATE_DTB: "false" 
  GENERATE_CHIP: "google/qcom_base" 
  BUILD_DEBUGGER: "false"          
  SKIP_PATCH: "false" 
  BUILD_OTHER_CONFIG: "false" 
  MERGE_CONFIG_FILES: ""
  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Google Pixel 4a 
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    env:
      CCACHE_DISABLE: "1"
      DEBIAN_FRONTEND: noninteractive 

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: 🛠️ Setup Container Environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          
          apt-get install -y --no-install-recommends sudo git wget ca-certificates binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler python3 python3-setuptools python-is-python3 bc flex bison libssl-dev libelf-dev libncurses5 libtinfo5 libc6-dev libncurses-dev lz4 zip unzip
          
          echo "[+] Fetching official AOSP mkdtimg tool..."
          wget https://raw.githubusercontent.com/LineageOS/android_system_libufdt/lineage-18.1/utils/src/mkdtboimg.py -O /usr/bin/mkdtimg
          chmod +x /usr/bin/mkdtimg
          
          git config --global --add safe.directory '*'
        shell: bash

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          # Disable problematic 32-bit legacy VDSO
          echo "[+] Disabling problematic 32-bit VDSO..."
          sed -i 's/CONFIG_VDSO32=y/# CONFIG_VDSO32 is not set/g' arch/arm64/configs/$DEFCONFIG_NAME
          sed -i 's/CONFIG_COMPAT_VDSO=y/# CONFIG_COMPAT_VDSO is not set/g' arch/arm64/configs/$DEFCONFIG_NAME
          echo "# CONFIG_VDSO32 is not set" >> arch/arm64/configs/$DEFCONFIG_NAME
          echo "# CONFIG_COMPAT_VDSO is not set" >> arch/arm64/configs/$DEFCONFIG_NAME

          # Disable LTO
          echo "[+] Disabling LTO..."
          sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/g' arch/arm64/configs/$DEFCONFIG_NAME
          echo "CONFIG_LTO_NONE=y" >> arch/arm64/configs/$DEFCONFIG_NAME
          
          # Disable Strong Stack Protector
          echo "[+] Disabling Stack Protector Entirely..."
          sed -i '/CONFIG_CC_STACKPROTECTOR/d' arch/arm64/configs/$DEFCONFIG_NAME
          echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set" >> arch/arm64/configs/$DEFCONFIG_NAME
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> arch/arm64/configs/$DEFCONFIG_NAME

          # Fix 64-character UTS_RELEASE limit
          echo "[+] Forcing kernel version string..."
          echo '#!/bin/sh' > scripts/setlocalversion
          echo 'echo "-By-Ayus-Chatterjee"' >> scripts/setlocalversion
          chmod +x scripts/setlocalversion
          sed -i 's/CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/g' arch/arm64/configs/$DEFCONFIG_NAME

          # Prevent Proton Clang's multi-line version string from breaking C syntax
          echo "[+] Fixing compiler version..."
          sed -i 's/.*LINUX_COMPILER.*/echo "#define LINUX_COMPILER \\"Proton Clang 13\\""/g' scripts/mkcompile_h

          # Force LZ4 Compression
          echo "[+] Setting LZ4 Kernel Compression..."
          sed -i 's/CONFIG_KERNEL_GZIP=y/# CONFIG_KERNEL_GZIP is not set/g' arch/arm64/configs/$DEFCONFIG_NAME
          sed -i 's/CONFIG_KERNEL_LZMA=y/# CONFIG_KERNEL_LZMA is not set/g' arch/arm64/configs/$DEFCONFIG_NAME
          echo "CONFIG_KERNEL_LZ4=y" >> arch/arm64/configs/$DEFCONFIG_NAME

          # Patch Makefile to suppress unknown warnings and GNU layout structures
          echo "[+] Patching Makefile to suppress unknown warnings..."
          echo "KBUILD_CFLAGS += -Wno-error -Wno-unknown-warning-option -Wno-gnu-variable-sized-type-not-at-end -Wno-initializer-overrides -Wno-pointer-sign -Wno-asm-operand-widths -Wno-tautological-compare -Wno-implicit-function-declaration -w" >> Makefile
          echo "KBUILD_HOSTCFLAGS += -Wno-error -Wno-unknown-warning-option -w" >> Makefile
          echo "HOSTCFLAGS += -Wno-error -Wno-unknown-warning-option -w" >> Makefile

          # Swap the missing haptic function call with an empty statement to preserve C syntax
          echo "[+] Fix a critical bug ..."
          sed -i 's/hap_ignore_next_request();/;/g' drivers/input/misc/fpc1020_platform_tee.c
          
      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      # --- NEW STEPS FOR INVESTIGATION ---
      - name: 📦 Test Susfs patches
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo "[+] Zipping fs and security/selinux directories..."
          zip -r9 $GITHUB_WORKSPACE/investigate-dirs.zip fs/ security/selinux/
        shell: bash

      - name: 📤 Upload investigation artifact
        uses: actions/upload-artifact@v4
        with:
          name: investigate-dirs
          path: investigate-dirs.zip

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Custom AnyKernel3 Zip
        run: |
          echo "[+] Cloning AnyKernel3..."
          git clone --depth=1 -b ${{ env.AK3_BRANCH }} ${{ env.AK3_SOURCE }} AnyKernel3
          
          echo "[+] Verifying LZ4 compilation and copying to AK3 folder..."
          if [ -f "$GITHUB_WORKSPACE/device_kernel/out/arch/arm64/boot/Image.lz4" ]; then
            cp $GITHUB_WORKSPACE/device_kernel/out/arch/arm64/boot/Image.lz4 AnyKernel3/
            echo "[+] Image.lz4 successfully copied."
          else
            echo "[-] ERROR: Image.lz4 was not found in the output directory!"
            exit 1
          fi
          
          cd AnyKernel3
          echo "[+] Cleaning up AnyKernel repository files..."
          rm -rf .git* README.md
          
          echo "[+] Generating flashable zip..."
          zip -r9 AnyKernel3-Pixel4a-sunfish-KSU.zip *
          mv AnyKernel3-Pixel4a-sunfish-KSU.zip $GITHUB_WORKSPACE/
          
        shell: bash

      # FIXED: Replaced generic upload action with standard GitHub upload action
      - name: ✏️ Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-Pixel4a-sunfish-KSU
          path: AnyKernel3-Pixel4a-sunfish-KSU.zip
