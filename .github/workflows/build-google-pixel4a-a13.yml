name: Build Google Pixel 4a (Stock A13)

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - mainline

env:
  # Device env
  DEVICE_NAME : "google_pixel_4a"
  DEVICE_CODENAME : "sunfish"

  CUSTOM_CMDS : "CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CROSS_COMPILE_COMPAT=arm-linux-gnueabi-"
  
  EXTRA_CMDS : "LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf HOSTCC=clang HOSTCXX=clang++ DTC=/usr/bin/dtc"

  KERNEL_SOURCE : "https://android.googlesource.com/kernel/msm"
  KERNEL_BRANCH : "android-msm-sunfish-4.14-android13"

  # Proton Clang (Clang 13)
  CLANG_SOURCE : "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH : "master"

  GCC_GNU : true
  GCC_64_SOURCE : ""
  GCC_64_BRANCH : ""
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "sunfish_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu" 

  SUSFS_ENABLE : false
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : "https://github.com/ayusc/NonGKI_Kernel_Build_2nd/releases/download/1234/pixel.4a.boot.img"

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "stock_a13"

  PYTHON_VERSION: "3" 

  # FIXED: Restored PACK_METHOD so the build-ready script runs correctly!
  PACK_METHOD: "MKBOOTIMG" 
  PACK_KMODULES: "false" 

  KERNELSU_METHOD: "shell" 

  PATCHES_SOURCE: "" 
  PATCHES_BRANCH: "" 

  SUSFS_FOLDER_FIXED: "" 
  SUSFS_PATCH_FIXED: "" 

  REKERNEL_ENABLE: "false" 
  DROIDSPACES_ENABLE: "false" 

  HOOK_METHOD: "syscall" 

  KERNEL_PATCH: "false" 

  KPM_ENABLE: "false" 
  KPM_INLINE: "false" 
  KPM_KPATCH_NEXT: "false" 
  KPM_PATCH_SOURCE: "" 

  BASEBAND_GUARD_ENABLE: "false" 
  BASEBAND_GUARD_BOOT: "false" 

  GENERATE_DTB: "false" 
  GENERATE_CHIP: "qcom" 

  BUILD_DEBUGGER: "false" 
  SKIP_PATCH: "false" 

  BUILD_OTHER_CONFIG: "false" 
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false" 

jobs:
  build-kernel:
    name: Google Pixel 4a (Stock A13 + ReSukiSU)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: 🛠️ Setup Container Environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          # Added curl required for build-ready script, and zip for MagiskBoot packaging
          apt-get install -y --no-install-recommends sudo git curl wget ca-certificates binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler python3 zip
          git config --global --add safe.directory '*'
        shell: bash

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          # ReSukiSU manual hook fail-safe
          if ! grep -q "ksu_handle_execveat" fs/exec.c; then
            echo "[+] Injecting missing ksu_handle_execveat hook into fs/exec.c..."
            sed -i '/static int do_execveat_common/i\#ifdef CONFIG_KSU\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n#endif\n' fs/exec.c
            sed -i '/if (IS_ERR(filename))/i\#ifdef CONFIG_KSU\n\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n#endif\n' fs/exec.c
          fi

          # Block Clang variable-sized array strictness errors
          sed -i '1i #pragma clang diagnostic ignored "-Wgnu-variable-sized-type-not-at-end"' include/linux/cgroup-defs.h

          # Disable legacy VDSO32
          sed -i 's/CONFIG_VDSO32=y/# CONFIG_VDSO32 is not set/g' arch/arm64/configs/sunfish_defconfig
          sed -i 's/CONFIG_COMPAT_VDSO=y/# CONFIG_COMPAT_VDSO is not set/g' arch/arm64/configs/sunfish_defconfig
          echo "# CONFIG_VDSO32 is not set" >> arch/arm64/configs/sunfish_defconfig
          echo "# CONFIG_COMPAT_VDSO is not set" >> arch/arm64/configs/sunfish_defconfig

          # Disable LTO to speed up linking
          sed -i 's/CONFIG_LTO=y/# CONFIG_LTO is not set/g' arch/arm64/configs/sunfish_defconfig
          sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/g' arch/arm64/configs/sunfish_defconfig
          sed -i 's/CONFIG_THINLTO=y/# CONFIG_THINLTO is not set/g' arch/arm64/configs/sunfish_defconfig

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 📦 Pack Custom Boot Image (MagiskBoot)
        run: |
          cd $GITHUB_WORKSPACE
          echo "[+] Downloading MagiskBoot from Uevo001 repository..."
          wget -q https://raw.githubusercontent.com/Uevo001/magiskboot-linux/main/x86_64/magiskboot -O /usr/local/bin/magiskboot
          chmod +x /usr/local/bin/magiskboot

          # Use the stock boot image perfectly downloaded by the internal build-ready script
          STOCK_IMG="boot_source_${{ env.DEVICE_NAME }}.img"
          
          # Capture the exact byte size of the original stock boot image
          STOCK_SIZE=$(stat -c%s $STOCK_IMG)
          echo "[+] Original stock boot image size: $STOCK_SIZE bytes"

          echo "[+] Unpacking Stock Boot Image..."
          mkdir repack
          cd repack
          magiskboot unpack ../$STOCK_IMG

          echo "[+] Replacing stock kernel with freshly compiled ReSukiSU kernel..."
          if [ -f "../device_kernel/out/arch/arm64/boot/Image.lz4-dtb" ]; then
            cp ../device_kernel/out/arch/arm64/boot/Image.lz4-dtb kernel
            echo "✅ Successfully swapped in compiled Image.lz4-dtb"
          elif [ -f "../device_kernel/out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp ../device_kernel/out/arch/arm64/boot/Image.gz-dtb kernel
            echo "✅ Successfully swapped in compiled Image.gz-dtb"
          else
            cp ../device_kernel/out/arch/arm64/boot/Image kernel
            echo "✅ Successfully swapped in raw Image"
          fi

          echo "[+] Repacking Boot Image..."
          magiskboot repack ../$STOCK_IMG new-boot.img

          truncate -s $STOCK_SIZE new-boot.img
          mv new-boot.img boot.img

          echo "[+] Zipping the final boot.img..."
          TIME=$(date +"%Y%m%d%H%M")
          ZIP_NAME="sunfish-${{ env.ROM_TEXT }}-$TIME-ReSukiSU-boot.zip"
          zip -9 ../$ZIP_NAME boot.img
          cd ..
          
          # Pass the zip name to the next step
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
        shell: bash

      - name: 📤 Upload Boot Image ZIP
        uses: actions/upload-artifact@v4
        with:
          name: sunfish-ReSukiSU-boot
          path: ${{ env.ZIP_NAME }}
          compression-level: 0 # File is already zipped, no need to double-compress
