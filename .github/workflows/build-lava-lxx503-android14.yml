name: Build Lava Blaze 5G (Android 14)

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - mainline
    paths:
      - '.github/workflows/build-lava-lxx503-android14.yml'

env:
  # Device env
  DEVICE_NAME : "lava_blaze_5g"
  DEVICE_CODENAME : "mt6833"

  CUSTOM_CMDS : "CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CROSS_COMPILE_COMPAT=arm-linux-gnueabi-"
  EXTRA_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf HOSTCC=clang HOSTCXX=clang++"

  # Your Forked Kernel Source
  KERNEL_SOURCE : "https://github.com/ayusc/android_kernel_realme_mt6833"
  KERNEL_BRANCH : "android-13.0"

  # Proton Clang (Clang 13) - Recommended for techyminati's tree
  CLANG_SOURCE : "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH : "master"

  GCC_GNU : true
  GCC_64_SOURCE : ""
  GCC_64_BRANCH : ""
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "mtk6833_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true" 
  KERNELSU_AUTO_FORK : "resukisu" 

  SUSFS_ENABLE : "false"
  SUSFS_FIXED : "false"

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "stock_a14"

  # Other env
  PYTHON_VERSION: "3" 

  PACK_METHOD: "Anykernel3" 
  PACK_KMODULES: "false" 

  KERNELSU_METHOD: "shell" 

  PATCHES_SOURCE: "ayusc/NonGKI_Kernel_Patches" 
  PATCHES_BRANCH: "" 

  SUSFS_FOLDER_FIXED: "" 
  SUSFS_PATCH_FIXED: "" 

  REKERNEL_ENABLE: "false" 
  DROIDSPACES_ENABLE: "false" 

  HOOK_METHOD: "syscall" 

  KERNEL_PATCH: "false" 

  KPM_ENABLE: "false" 
  KPM_INLINE: "false" 
  KPM_KPATCH_NEXT: "false" 
  KPM_PATCH_SOURCE: ""

  BASEBAND_GUARD_ENABLE: "false" 
  BASEBAND_GUARD_BOOT: "false" 

  GENERATE_DTB: "true"
  GENERATE_CHIP: "mediatek"

  BUILD_DEBUGGER: "false" 
  SKIP_PATCH: "false" 

  BUILD_OTHER_CONFIG: "false" 
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false" 

jobs:
  build-kernel:
    name: Lava Blaze 5G
    runs-on: ubuntu-latest 
    container: ubuntu:focal 
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: 🛠️ Setup Container Environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get remove -y g++-multilib gcc-multilib || true
          apt-get autoremove -y || true
          apt-get install -y --no-install-recommends \
            sudo git wget ca-certificates \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            device-tree-compiler python3 python3-setuptools python-is-python3 \
            bc flex bison libssl-dev libelf-dev libncurses5 libtinfo5 \
            libc6-dev libncurses-dev lz4 zip unzip
          git config --global --add safe.directory '*'
        shell: bash

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          echo "[+] Disabling LTO"
          sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/g' arch/arm64/configs/$DEFCONFIG_NAME
          echo "CONFIG_LTO_NONE=y" >> arch/arm64/configs/$DEFCONFIG_NAME
          
          # Patch Makefile to suppress unknown warnings and GNU layout structures
          echo "[+] Patching Makefile"
          echo "KBUILD_CFLAGS += -Wno-error -Wno-unknown-warning-option -Wno-gnu-variable-sized-type-not-at-end -Wno-initializer-overrides -Wno-pointer-sign -Wno-asm-operand-widths -Wno-tautological-compare -Wno-implicit-function-declaration -w" >> Makefile
          echo "KBUILD_HOSTCFLAGS += -Wno-error -Wno-unknown-warning-option -w" >> Makefile
          echo "HOSTCFLAGS += -Wno-error -Wno-unknown-warning-option -w" >> Makefile

          echo "[+] Fix some bugs"

          echo "[+] Injecting Dummy Phoenix tracking parameters to clear init/main.c compilation"
          sed -i '1s/^/#define KERNEL_MM_INIT_DONE 0\n#define KERNEL_LOCAL_IRQ_ENABLE 0\n#define KERNEL_DELAYACCT_INIT_DONE 0\n#define KERNEL_DRIVER_INIT_DONE 0\n#define KERNEL_DO_INITCALLS_DONE 0\n#define KERNEL_INIT_DONE 0\n#define KERNEL_DO_BASIC_SETUP_DONE 0\nstatic void (*phx_set_boot_stage)(int stage) = NULL;\n/' init/main.c

          # === THE ABSOLUTE CAMERA SYSTEM FIX ===
          echo "[+] Dynamic Camera Driver Auto-Stubber"
          SENSOR_LIST=$(grep 'CONFIG_CUSTOM_KERNEL_IMGSENSOR=' arch/arm64/configs/$DEFCONFIG_NAME | sed 's/CONFIG_CUSTOM_KERNEL_IMGSENSOR=//' | tr -d '"')
          for sensor in $SENSOR_LIST; do
              TARGET_DIR="drivers/misc/mediatek/imgsensor/src/common/v1_1/$sensor"
              if [ ! -f "$TARGET_DIR/Makefile" ]; then
                  echo "    -> Auto-stubbing missing camera dependency: $sensor"
                  mkdir -p "$TARGET_DIR"
                  echo "obj-y +=" > "$TARGET_DIR/Makefile"
              fi
          done

          # === SENSOR 2.0 ARCHITECTURE PURGE ===
          echo "[+] Purging leftover MediaTek sensor 2.0 uncleaned module references"
          find . -type f -name "Makefile*" -exec sed -i '/oplus_sensor_devinfo/d' {} +
          find . -type f -name "Makefile*" -exec sed -i '/oplus_virtual_sensor/d' {} +

          # 1. Fix the 'NULL' undeclared identifier error in init/main.c
          sed -i 's/ = NULL//g' init/main.c
          
          # 2. Fix the missing drivers/soc/oplus/system/Makefile error by completely stubbing out the parent oplus Makefile
          echo "obj-y +=" > drivers/soc/oplus/Makefile
          sed -i '/oplus/d' drivers/soc/Makefile
          sed -i '/oplus_ion/d' drivers/staging/android/mtk_ion/Makefile

          sed -i '/sched_assist_common\.h/d' kernel/cgroup/cgroup-v1.c

          sed -i '/multi_freearea\.h/d' mm/page_alloc.c
          
          sed -i '/healthinfo\/ion\.h/d' fs/proc/meminfo.c

          sed -i '/process_mm_reclaim\.h/d' mm/vmscan.c
          
          sed -i '/sched_assist_common\.h/d' kernel/locking/rwsem-xadd.c

          # 1. Clear the ghost memory optimization header from virtual memory statistics
          sed -i '/multi_freearea\.h/d' mm/vmstat.c
          
          # 2. Clear the missing scheduler tracking hook from the core Linux scheduler engine
          sed -i '/sched_assist_common\.h/d' kernel/sched/core.c

          # 1. Fix the vmstat error by creating a dummy variable for the missing proc array address
          sed -i '1s/^/static const int proc_free_area_fops = 0;\n/' mm/vmstat.c
          
          # 2. Fix the core scheduler errors by nullifying the missing Turbo macros and variables
          sed -i '1s/^/#define SA_TYPE_TURBO 0\nstatic int ux_uclamp_value = 0;\n/' kernel/sched/core.c
                    
      - name: 📦 Archive Patched Files for Review
        if: false
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          mkdir -p $GITHUB_WORKSPACE/patched_files
          
          echo "[+] Gathering modified files..."
          git status -s | grep -E '^( M|M |A |A|AM|MM|\?\?)' | awk '{print $2}' | while read file; do
            if [ -f "$file" ]; then
              mkdir -p "$GITHUB_WORKSPACE/patched_files/$(dirname "$file")"
              cp "$file" "$GITHUB_WORKSPACE/patched_files/$file"
            fi
          done
          
          echo "[+] Gathering KernelSU directory..."
          if [ -d "drivers/kernelsu" ]; then
            mkdir -p $GITHUB_WORKSPACE/patched_files/drivers
            cp -rL drivers/kernelsu $GITHUB_WORKSPACE/patched_files/drivers/
          fi
          
          echo "[+] Gathering reject files (if any)..."
          find . -name "*.rej" -exec cp --parents {} $GITHUB_WORKSPACE/patched_files/ \; || true
          
          cd $GITHUB_WORKSPACE/patched_files
          zip -r $GITHUB_WORKSPACE/patched_files_review.zip .
        shell: bash

      - name: 📤 Upload Patched Files Artifact
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: Patched-Files-Review
          path: ${{ github.workspace }}/patched_files_review.zip
        
      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
