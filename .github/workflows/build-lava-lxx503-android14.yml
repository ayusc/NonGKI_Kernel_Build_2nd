name: Build Lava Blaze 5G (Android 14)

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - mainline
    paths:
      - '.github/workflows/build-lava-lxx503-android14.yml'

env:
  # Device env
  DEVICE_NAME : "lava_blaze_5g"
  DEVICE_CODENAME : "mt6833"

  CUSTOM_CMDS : "CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CROSS_COMPILE_COMPAT=arm-linux-gnueabi-"
  EXTRA_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf HOSTCC=clang HOSTCXX=clang++"

  # Your Forked Kernel Source
  KERNEL_SOURCE : "https://github.com/ayusc/android_kernel_realme_mt6833"
  KERNEL_BRANCH : "android-13.0"

  # Proton Clang (Clang 13) - Recommended for techyminati's tree
  CLANG_SOURCE : "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH : "master"

  GCC_GNU : true
  GCC_64_SOURCE : ""
  GCC_64_BRANCH : ""
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "mtk6833_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true" 
  KERNELSU_AUTO_FORK : "resukisu" 

  SUSFS_ENABLE : "false"
  SUSFS_FIXED : "false"

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "stock_a14"

  # Other env
  PYTHON_VERSION: "3" 

  PACK_METHOD: "Anykernel3" 
  PACK_KMODULES: "false" 

  KERNELSU_METHOD: "shell" 

  PATCHES_SOURCE: "ayusc/NonGKI_Kernel_Patches" 
  PATCHES_BRANCH: "" 

  SUSFS_FOLDER_FIXED: "" 
  SUSFS_PATCH_FIXED: "" 

  REKERNEL_ENABLE: "false" 
  DROIDSPACES_ENABLE: "false" 

  HOOK_METHOD: "syscall" 

  KERNEL_PATCH: "false" 

  KPM_ENABLE: "false" 
  KPM_INLINE: "false" 
  KPM_KPATCH_NEXT: "false" 
  KPM_PATCH_SOURCE: ""

  BASEBAND_GUARD_ENABLE: "false" 
  BASEBAND_GUARD_BOOT: "false" 

  GENERATE_DTB: "true"
  GENERATE_CHIP: "mediatek"

  BUILD_DEBUGGER: "false" 
  SKIP_PATCH: "false" 

  BUILD_OTHER_CONFIG: "false" 
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false" 

jobs:
  build-kernel:
    name: Lava Blaze 5G
    runs-on: ubuntu-latest 
    container: ubuntu:focal 
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: 🛠️ Setup Container Environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get remove -y g++-multilib gcc-multilib || true
          apt-get autoremove -y || true
          apt-get install -y --no-install-recommends \
            sudo git wget ca-certificates \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            device-tree-compiler python3 python3-setuptools python-is-python3 \
            bc flex bison libssl-dev libelf-dev libncurses5 libtinfo5 \
            libc6-dev libncurses-dev lz4 zip unzip
          git config --global --add safe.directory '*'
        shell: bash

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          echo "[+] Disabling LTO"
          sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/g' arch/arm64/configs/$DEFCONFIG_NAME
          echo "CONFIG_LTO_NONE=y" >> arch/arm64/configs/$DEFCONFIG_NAME
          
          # Patch Makefile to suppress unknown warnings and GNU layout structures
          echo "[+] Patching Makefile"
          echo "KBUILD_CFLAGS += -Wno-error -Wno-unknown-warning-option -Wno-gnu-variable-sized-type-not-at-end -Wno-initializer-overrides -Wno-pointer-sign -Wno-asm-operand-widths -Wno-tautological-compare -Wno-implicit-function-declaration -w" >> Makefile
          echo "KBUILD_HOSTCFLAGS += -Wno-error -Wno-unknown-warning-option -w" >> Makefile
          echo "HOSTCFLAGS += -Wno-error -Wno-unknown-warning-option -w" >> Makefile
          
          echo "[+] Fix some bugs"          
          # 46. Stub out project identity checks in mtk_nanohub to prevent undeclared identifier errors
          sed -i '1s/^/#define is_project(...) 0\n#define is_support_new_arch_func(...) 0\n/' drivers/misc/mediatek/sensor/2.0/mtk_nanohub/mtk_nanohub.c
          # 47. Fix project header and stubs for oplus_ts_tempntc thermal driver
          sed -i '/oppo_project\.h/d' drivers/misc/mediatek/thermal/common/thermal_zones/oplus_ts_tempntc.c
          sed -i '1s/^/#define AGING 999\n#define PREVERSION 998\n#define HIGH_TEMP_AGING 997\n#define FACTORY 996\n/' drivers/misc/mediatek/thermal/common/thermal_zones/oplus_ts_tempntc.c
          
          # 48. Fix project header, stubs, and get_eng_version mapping for mtk_lvts_tc thermal core
          sed -i '/oplus_project\.h/d' drivers/misc/mediatek/thermal/mt6833/src/mtk_lvts_tc.c
          sed -i '1s/^/#define AGING 999\n#define PREVERSION 998\n#define HIGH_TEMP_AGING 997\n#define FACTORY 996\n#define get_eng_version() 0\n/' drivers/misc/mediatek/thermal/mt6833/src/mtk_lvts_tc.c
          
          # 49. Fix project header, stubs, and get_eng_version mapping for mtk_cooler_sysrst driver
          sed -i '/oplus_project\.h/d' drivers/misc/mediatek/thermal/common/coolers/mtk_cooler_sysrst.c
          sed -i '1s/^/#define AGING 999\n#define PREVERSION 998\n#define HIGH_TEMP_AGING 997\n#define FACTORY 996\n#define get_eng_version() 0\n/' drivers/misc/mediatek/thermal/common/coolers/mtk_cooler_sysrst.c
          # 50. Fix project header, stubs, and get_eng_version mapping for mtk_cooler_kshutdown driver
          sed -i '/oplus_project\.h/d' drivers/misc/mediatek/thermal/mtk_cooler_kshutdown.c
          sed -i '1s/^/#define AGING 999\n#define PREVERSION 998\n#define HIGH_TEMP_AGING 997\n#define FACTORY 996\n#define get_eng_version() 0\n/' drivers/misc/mediatek/thermal/mtk_cooler_kshutdown.c
          # 51. Fix project header, stubs, and get_eng_version mapping for mtk_ts_battery thermal driver
          sed -i '/oplus_project\.h/d' drivers/misc/mediatek/thermal/common/thermal_zones/mtk_ts_battery.c
          sed -i '1s/^/#define AGING 999\n#define PREVERSION 998\n#define HIGH_TEMP_AGING 997\n#define FACTORY 996\n#define get_eng_version() 0\n/' drivers/misc/mediatek/thermal/common/thermal_zones/mtk_ts_battery.c
          # 52. Fix project header, stubs, and get_eng_version mapping for mtk_ts_pa thermal driver
          sed -i '/oplus_project\.h/d' drivers/misc/mediatek/thermal/common/thermal_zones/mtk_ts_pa.c
          sed -i '1s/^/#define AGING 999\n#define PREVERSION 998\n#define HIGH_TEMP_AGING 997\n#define FACTORY 996\n#define get_eng_version() 0\n/' drivers/misc/mediatek/thermal/common/thermal_zones/mtk_ts_pa.c
          # 53. Fix project header, stubs, and get_eng_version mapping for mtk_ts_pmic thermal driver
          sed -i '/oplus_project\.h/d' drivers/misc/mediatek/thermal/common/thermal_zones/mtk_ts_pmic.c
          sed -i '1s/^/#define AGING 999\n#define PREVERSION 998\n#define HIGH_TEMP_AGING 997\n#define FACTORY 996\n#define get_eng_version() 0\n/' drivers/misc/mediatek/thermal/common/thermal_zones/mtk_ts_pmic.c
          # 54. Proactive sweep loop to catch and fix all remaining thermal driver ghost headers
          echo "[+] Proactively sweeping thermal folder for ghost headers..."
          for file in $(find drivers/misc/mediatek/thermal/ -type f \( -name "*.c" -o -name "*.h" \) -exec grep -lE "oplus_project\.h|oppo_project\.h" {} +); do
              echo "  -> Patching: $file"
              sed -i '/oplus_project\.h/d' "$file"
              sed -i '/oppo_project\.h/d' "$file"
              sed -i '1s/^/#define AGING 999\n#define PREVERSION 998\n#define HIGH_TEMP_AGING 997\n#define FACTORY 996\n#define get_eng_version() 0\n/' "$file"
          done          
          # 55. Master Vendor Stub File: Satisfy all missing ODM hooks (Oppo/Oplus) to allow vmlinux linking
          echo "[+] Creating master kernel/oplus_performance_stubs.c to solve ALL final linker errors"
          cat << 'EOF' > kernel/oplus_performance_stubs.c
          #include <linux/kernel.h>
          
          // Disable strict prototype warnings so the compiler accepts our universal dummy functions
          #pragma GCC diagnostic ignored "-Wstrict-prototypes"
          #pragma GCC diagnostic ignored "-Wmissing-prototypes"
          
          // --- VARIABLES ---
          void *proc_ux_state_operations = NULL;
          long ion_total = 0;
          int ux_sched_cputopo = 0;
          
          // --- PREVIOUS BATCH ---
          long init_task_ux_info() { return 0; }
          long phx_is_phoenix_boot_completed() { return 1; }
          long is_critial_process() { return 0; }
          long oppo_is_android_core_group() { return 0; }
          long sysctl_sched_assist_scene_handler() { return 0; }
          long hans_report() { return 0; }
          long oplus_boost_kill_signal() { return 0; }
          long is_key_process() { return 0; }
          long ux_init_cpu_data() { return 0; }
          long ux_init_rq_data() { return 0; }
          long sf_task_util_record() { return 0; }
          long test_task_ux() { return 0; }
          long place_entity_adjust_ux_task() { return 0; }
          long enqueue_ux_thread() { return 0; }
          long dequeue_ux_thread() { return 0; }
          long should_ux_preempt_wakeup() { return 0; }
          void *pick_ux_thread() { return NULL; }
          long is_heavy_ux_task() { return 0; }
          long should_ux_task_skip_cpu() { return 0; }
          
          // --- NEW BATCH: SCHEDULER & MEMORY ---
          long should_ux_task_skip_further_check() { return 0; }
          long drop_ux_task_cpus() { return 0; }
          long update_ux_sched_cputopo() { return 0; }
          long mutex_unset_inherit_ux() { return 0; }
          long mutex_list_add() { return 0; }
          long mutex_set_inherit_ux() { return 0; }
          long rwsem_unset_inherit_ux() { return 0; }
          long rwsem_set_inherit_ux() { return 0; }
          long cgroup_set_sched_assist_boost_task() { return 0; }
          long get_eng_version() { return 0; }
          long list_sort_add() { return 0; }
          long page_to_flc() { return 0; }
          long ajust_flc() { return 0; }
          long ajust_zone_label() { return 0; }
          long is_reclaim_should_cancel() { return 0; }
          long sched_assist_target_comm() { return 0; }
          long get_project() { return 0; }
          
          // --- NEW BATCH: PMIC, CHARGING, USB ---
          long oplus_chg_check_break() { return 0; }
          long oplus_chg_track_check_wired_charging_break() { return 0; }
          long oplus_otgctl_by_buckboost() { return 0; }
          long oplus_vooc_get_fastchg_started() { return 0; }
          long oplus_vooc_get_adapter_update_status() { return 0; }
          long oplus_vooc_get_fastchg_to_normal() { return 0; }
          long oplus_vooc_get_fastchg_to_warm() { return 0; }
          long oplus_chg_wake_update_work() { return 0; }
          long oplus_vooc_reset_fastchg_after_usbout() { return 0; }
          long oplus_chg_set_chargerid_switch_val() { return 0; }
          long oplus_chg_clear_chargerid_info() { return 0; }
          long oplus_chg_set_charger_type_unknown() { return 0; }
          long is_vooc_support_single_batt_svooc() { return 0; }
          long oplus_chg_get_voocphy_support() { return 0; }
          long oplus_chg_set_otg_online() { return 0; }
          long oplus_otg_disable_by_buckboost() { return 0; }
          long vooc_enable_cp_for_otg() { return 0; }
          long oplus_otg_enable_by_buckboost() { return 0; }
          long is_fuelgauge_apply() { return 0; }
          long oplus_get_chg_unwakelock() { return 0; }
          long oplus_gauge_set_event() { return 0; }
          
          // --- NEW BATCH: SENSORS, CAMERA, NFC ---
          long virtual_sensor_report_data() { return 0; }
          long oplus_init_sensor_state() { return 0; }
          long mm_keylog_write_modemdump() { return 0; }
          long is_project() { return 0; }
          long register_device_proc() { return 0; }
          long oplus_chg_set_camera_on() { return 0; }
          long pmic_gpio_enable() { return 0; }
          long fan53870_cam_ldo_set_voltage() { return 0; }
          long is_fan53870_pmic() { return 0; }
          long fan53870_cam_ldo_disable() { return 0; }
          long pmic_ldo_set_voltage_mv() { return 0; }
          long pmic_ldo_get_type() { return 0; }
          long pmic_ldo_set_disable() { return 0; }
          long get_PCB_Version() { return 0; }
          long oplus_chg_set_camera_status() { return 0; }
          long is_support_chip() { return 1; } // NFC probe safeguard
          long register_device_proc_for_ufsplus() { return 0; }
          
          // --- NEW BATCH: BINDER & UI ---
          long binder_unset_inherit_ux() { return 0; }
          long binder_set_inherit_ux() { return 0; }
          long is_sf() { return 0; }
          long is_launcher() { return 0; }
          long set_heavy_ux() { return 0; }
          long set_once_ux() { return 0; }
          long ux_debug_enable() { return 0; }
          long ux_debug_systrace_c() { return 0; }
          
          // --- NEW BATCH: AUDIO (AW87339 / SIA81XX) ---
          long aw87339_audio_spk_if_kspk() { return 0; }
          long aw87339_audio_spk_if_off() { return 0; }
          long aw87339_audio_rcv_if_kspk() { return 0; }
          long aw87339_audio_rcv_if_off() { return 0; }
          long aw87339_audio_rcv_if_drcv() { return 0; }
          long aw87339_spk_low_voltage_status() { return 0; }
          long aw87339_audio_spk_low_voltage_status() { return 0; }
          long aw87339_voice_status() { return 0; }
          long aw87339_voice_setting() { return 0; }
          long soc_aux_init_only_sia81xx() { return 0; }
          long sia81xx_start() { return 0; }
          long sia81xx_stop() { return 0; }
          long oplus_ext_amp_recv_enable() { return 0; }
          long oplus_ext_amp_r_enable() { return 0; }
          
          EOF
          
          # Inject the master stub into the core kernel compilation sequence if not already present
          if ! grep -q "oplus_performance_stubs.o" kernel/Makefile; then
              echo "obj-y += oplus_performance_stubs.o" >> kernel/Makefile
          fi

      - name: 📦 Archive Patched Files for Review
        if: false
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          mkdir -p $GITHUB_WORKSPACE/patched_files
          
          echo "[+] Gathering modified files..."
          git status -s | grep -E '^( M|M |A |A|AM|MM|\?\?)' | awk '{print $2}' | while read file; do
            if [ -f "$file" ]; then
              mkdir -p "$GITHUB_WORKSPACE/patched_files/$(dirname "$file")"
              cp "$file" "$GITHUB_WORKSPACE/patched_files/$file"
            fi
          done
          
          echo "[+] Gathering KernelSU directory..."
          if [ -d "drivers/kernelsu" ]; then
            mkdir -p $GITHUB_WORKSPACE/patched_files/drivers
            cp -rL drivers/kernelsu $GITHUB_WORKSPACE/patched_files/drivers/
          fi
          
          echo "[+] Gathering reject files (if any)..."
          find . -name "*.rej" -exec cp --parents {} $GITHUB_WORKSPACE/patched_files/ \; || true
          
          cd $GITHUB_WORKSPACE/patched_files
          zip -r $GITHUB_WORKSPACE/patched_files_review.zip .
        shell: bash

      - name: 📤 Upload Patched Files Artifact
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: Patched-Files-Review
          path: ${{ github.workspace }}/patched_files_review.zip
        
      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
