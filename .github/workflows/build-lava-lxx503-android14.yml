name: Build Lava Blaze 5G (Android 14)

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - mainline
    paths:
      - '.github/workflows/build-lava-lxx503-android14.yml'

env:
  # Device env
  DEVICE_NAME : "lava_blaze_5g"
  DEVICE_CODENAME : "mt6833"

  CUSTOM_CMDS : "CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CROSS_COMPILE_COMPAT=arm-linux-gnueabi-"
  EXTRA_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf HOSTCC=clang HOSTCXX=clang++"

  # Your Forked Kernel Source
  KERNEL_SOURCE : "https://github.com/ayusc/android_kernel_realme_mt6833"
  KERNEL_BRANCH : "android-13.0"

  # Proton Clang (Clang 13) - Recommended for techyminati's tree
  CLANG_SOURCE : "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH : "master"

  GCC_GNU : true
  GCC_64_SOURCE : ""
  GCC_64_BRANCH : ""
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "mtk6833_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true" 
  KERNELSU_AUTO_FORK : "resukisu" 

  SUSFS_ENABLE : "false"
  SUSFS_FIXED : "false"

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "stock_a14"

  # Other env
  PYTHON_VERSION: "3" 

  PACK_METHOD: "Anykernel3" 
  PACK_KMODULES: "false" 

  KERNELSU_METHOD: "shell" 

  PATCHES_SOURCE: "ayusc/NonGKI_Kernel_Patches" 
  PATCHES_BRANCH: "" 

  SUSFS_FOLDER_FIXED: "" 
  SUSFS_PATCH_FIXED: "" 

  REKERNEL_ENABLE: "false" 
  DROIDSPACES_ENABLE: "false" 

  HOOK_METHOD: "syscall" 

  KERNEL_PATCH: "false" 

  KPM_ENABLE: "false" 
  KPM_INLINE: "false" 
  KPM_KPATCH_NEXT: "false" 
  KPM_PATCH_SOURCE: ""

  BASEBAND_GUARD_ENABLE: "false" 
  BASEBAND_GUARD_BOOT: "false" 

  GENERATE_DTB: "true"
  GENERATE_CHIP: "mediatek"

  BUILD_DEBUGGER: "false" 
  SKIP_PATCH: "false" 

  BUILD_OTHER_CONFIG: "false" 
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false" 

jobs:
  build-kernel:
    name: Lava Blaze 5G
    runs-on: ubuntu-latest 
    container: ubuntu:focal 
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: 🛠️ Setup Container Environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get remove -y g++-multilib gcc-multilib || true
          apt-get autoremove -y || true
          apt-get install -y --no-install-recommends \
            sudo git wget ca-certificates \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            device-tree-compiler python3 python3-setuptools python-is-python3 \
            bc flex bison libssl-dev libelf-dev libncurses5 libtinfo5 \
            libc6-dev libncurses-dev lz4 zip unzip
          git config --global --add safe.directory '*'
        shell: bash

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          echo "[+] Disabling LTO"
          sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/g' arch/arm64/configs/$DEFCONFIG_NAME
          echo "CONFIG_LTO_NONE=y" >> arch/arm64/configs/$DEFCONFIG_NAME
          
          # Patch Makefile to suppress unknown warnings and GNU layout structures
          echo "[+] Patching Makefile"
          echo "KBUILD_CFLAGS += -Wno-error -Wno-unknown-warning-option -Wno-gnu-variable-sized-type-not-at-end -Wno-initializer-overrides -Wno-pointer-sign -Wno-asm-operand-widths -Wno-tautological-compare -Wno-implicit-function-declaration -w" >> Makefile
          echo "KBUILD_HOSTCFLAGS += -Wno-error -Wno-unknown-warning-option -w" >> Makefile
          echo "HOSTCFLAGS += -Wno-error -Wno-unknown-warning-option -w" >> Makefile
          
          echo "[+] Fix some bugs"          
          
          # Battery driver - remove both oplus headers
          sed -i '/oplus_gauge\.h/d' drivers/power/supply/mediatek/battery/mtk_battery.c
          sed -i '/oplus_project\.h/d' drivers/power/supply/mediatek/battery/mtk_battery.c
          sed -i '1s/^/#define AGING 999\n#define PREVERSION 998\n#define HIGH_TEMP_AGING 997\n#define FACTORY 996\n#define PCB_VERSION_EVT1 1\n/' drivers/power/supply/mediatek/battery/mtk_battery.c
          
          # Imgsensor GPIO driver
          sed -i '/<soc\/oplus\/system\/oplus_project\.h>/d' drivers/misc/mediatek/imgsensor/src/mt6853/camera_hw_mt6833/../../common/v1_1/camera_hw/gpio/gpio.c
          sed -i '1s/^/#define AGING 999\n#define PREVERSION 998\n#define HIGH_TEMP_AGING 997\n#define FACTORY 996\n/' drivers/misc/mediatek/imgsensor/src/mt6853/camera_hw_mt6833/../../common/v1_1/camera_hw/gpio/gpio.c
          
          # Imgsensor Regulator driver - ADD THIS
          sed -i '/<soc\/oplus\/system\/oplus_project\.h>/d' drivers/misc/mediatek/imgsensor/src/mt6853/camera_hw_mt6833/../../common/v1_1/camera_hw/regulator/regulator.c
          sed -i '1s/^/#define AGING 999\n#define PREVERSION 998\n#define HIGH_TEMP_AGING 997\n#define FACTORY 996\n/' drivers/misc/mediatek/imgsensor/src/mt6853/camera_hw_mt6833/../../common/v1_1/camera_hw/regulator/regulator.c
          
          # Original patches
          sed -i '/oplus_project\.h/d' drivers/pinctrl/mediatek/pinctrl-paris.c
          sed -i '1s/^/#define AGING 999\n#define PREVERSION 998\n#define HIGH_TEMP_AGING 997\n#define FACTORY 996\n/' drivers/pinctrl/mediatek/pinctrl-paris.c
          
          sed -i '/oppo_project\.h/d' drivers/misc/mediatek/flashlight/flashlight-core.c
          sed -i '1s/^/#define AGING 999\n#define PREVERSION 998\n#define HIGH_TEMP_AGING 997\n#define FACTORY 996\n/' drivers/misc/mediatek/flashlight/flashlight-core.c
          
          sed -i '/oplus_project\.h/d' drivers/misc/mediatek/flashlight/oplus/flashlight_custom.h
          sed -i '1s/^/#define AGING 999\n#define PREVERSION 998\n#define HIGH_TEMP_AGING 997\n#define FACTORY 996\n/' drivers/misc/mediatek/flashlight/oplus/flashlight_custom.h
          
          sed -i '/oplus_project\.h/d' drivers/misc/mediatek/flashlight/flashlights-mt6360.c
          sed -i '1s/^/#define AGING 999\n#define PREVERSION 998\n#define HIGH_TEMP_AGING 997\n#define FACTORY 996\n/' drivers/misc/mediatek/flashlight/flashlights-mt6360.c

          # 31. Fix project header and stubs for MediaTek image sensor common driver
          sed -i '/oplus_project\.h/d' drivers/misc/mediatek/imgsensor/src/common/v1_1/imgsensor.c
          sed -i '1s/^/#define AGING 999\n#define PREVERSION 998\n#define HIGH_TEMP_AGING 997\n#define FACTORY 996\n/' drivers/misc/mediatek/imgsensor/src/common/v1_1/imgsensor.c
          
          # 32. Fix project header and stubs for MediaTek main lens driver
          sed -i '/oplus_project\.h/d' drivers/misc/mediatek/lens/mtk/main/main_lens.c
          sed -i '1s/^/#define AGING 999\n#define PREVERSION 998\n#define HIGH_TEMP_AGING 997\n#define FACTORY 996\n/' drivers/misc/mediatek/lens/mtk/main/main_lens.c
          
          # 33. Bypass Oplus battery gauge hooks entirely to restore standard MediaTek battery driver
          sed -i '1s/^/#undef OPLUS_FEATURE_CHG_BASIC\n/' drivers/power/supply/mediatek/battery/mtk_battery.c

          # 34. Fix display kernel event header and stubs for MediaTek CMDQ helper
          sed -i '/oplus_mm_kevent_fb\.h/d' drivers/soc/mediatek/mtk-cmdq-helper.c
          sed -i '1s/^/#define MM_FB_KEY_RATELIMIT_1H 0\n#define mm_fb_display_kevent(...) do {} while(0)\n/' drivers/soc/mediatek/mtk-cmdq-helper.c
          
          # 35. Fix project header and stubs for Oplus custom image sensor config
          sed -i '/oplus_project\.h/d' drivers/misc/mediatek/imgsensor/src/OplusImgsensor/imgsensor_hwcfg_custom.h
          sed -i '1s/^/#define AGING 999\n#define PREVERSION 998\n#define HIGH_TEMP_AGING 997\n#define FACTORY 996\n/' drivers/misc/mediatek/imgsensor/src/OplusImgsensor/imgsensor_hwcfg_custom.h
          # 36. Fix missing tracking variables in MediaTek ION memory driver
          sed -i '1s/^/#define ion_cnt_enable 0\nstatic atomic_long_t ion_total_size;\n/' drivers/staging/android/mtk_ion/ion.c
          
          # 37. Fix project header and stubs for image sensor hardware core
          sed -i '/oplus_project\.h/d' drivers/misc/mediatek/imgsensor/src/common/v1_1/imgsensor_hw.c
          sed -i '1s/^/#define AGING 999\n#define PREVERSION 998\n#define HIGH_TEMP_AGING 997\n#define FACTORY 996\n/' drivers/misc/mediatek/imgsensor/src/common/v1_1/imgsensor_hw.c

          # 38. Fix missing atomic type definition header in the ION driver stub
          sed -i '1s/^/#include <linux\/atomic.h>\n/' drivers/staging/android/mtk_ion/ion.c
          
          # 39. Fix project header and stubs for image sensor EEPROM driver
          sed -i '/oplus_project\.h/d' drivers/misc/mediatek/imgsensor/src/OplusImgsensor/imgsensor_eeprom.c
          sed -i '1s/^/#define AGING 999\n#define PREVERSION 998\n#define HIGH_TEMP_AGING 997\n#define FACTORY 996\n/' drivers/misc/mediatek/imgsensor/src/OplusImgsensor/imgsensor_eeprom.c
          
          # 40. Fix project header and stubs for lens BU64253AF focus driver
          sed -i '/oppo_project\.h/d' drivers/misc/mediatek/lens/mtk/main/common/bu64253af/BU64253AF.c
          sed -i '1s/^/#define AGING 999\n#define PREVERSION 998\n#define HIGH_TEMP_AGING 997\n#define FACTORY 996\n/' drivers/misc/mediatek/lens/mtk/main/common/bu64253af/BU64253AF.c
          
      - name: 📦 Archive Patched Files for Review
        if: false
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          mkdir -p $GITHUB_WORKSPACE/patched_files
          
          echo "[+] Gathering modified files..."
          git status -s | grep -E '^( M|M |A |A|AM|MM|\?\?)' | awk '{print $2}' | while read file; do
            if [ -f "$file" ]; then
              mkdir -p "$GITHUB_WORKSPACE/patched_files/$(dirname "$file")"
              cp "$file" "$GITHUB_WORKSPACE/patched_files/$file"
            fi
          done
          
          echo "[+] Gathering KernelSU directory..."
          if [ -d "drivers/kernelsu" ]; then
            mkdir -p $GITHUB_WORKSPACE/patched_files/drivers
            cp -rL drivers/kernelsu $GITHUB_WORKSPACE/patched_files/drivers/
          fi
          
          echo "[+] Gathering reject files (if any)..."
          find . -name "*.rej" -exec cp --parents {} $GITHUB_WORKSPACE/patched_files/ \; || true
          
          cd $GITHUB_WORKSPACE/patched_files
          zip -r $GITHUB_WORKSPACE/patched_files_review.zip .
        shell: bash

      - name: 📤 Upload Patched Files Artifact
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: Patched-Files-Review
          path: ${{ github.workspace }}/patched_files_review.zip
        
      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
