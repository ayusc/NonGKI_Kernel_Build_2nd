name: Build Google Pixel 4a (Stock A13)

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - mainline

env:
  # Device env
  DEVICE_NAME : "google_pixel_4a"
  DEVICE_CODENAME : "sunfish"

  CUSTOM_CMDS : "CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CROSS_COMPILE_COMPAT=arm-linux-gnueabi-"
  
  EXTRA_CMDS : "CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf HOSTCC=clang HOSTCXX=clang++"

  KERNEL_SOURCE : "https://android.googlesource.com/kernel/msm"
  KERNEL_BRANCH : "android-msm-sunfish-4.14-android13"

  # Proton Clang (Clang 13)
  CLANG_SOURCE : "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH : "master"

  GCC_GNU : true
  GCC_64_SOURCE : ""
  GCC_64_BRANCH : ""
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "sunfish_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu" 

  SUSFS_ENABLE : false
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "stock_a13"

  PYTHON_VERSION: "3" 

  PACK_METHOD: "Anykernel3" 
  PACK_KMODULES: "false" 

  KERNELSU_METHOD: "shell" 

  PATCHES_SOURCE: "" 
  PATCHES_BRANCH: "" 

  SUSFS_FOLDER_FIXED: "" 
  SUSFS_PATCH_FIXED: "" 

  REKERNEL_ENABLE: "false" 
  DROIDSPACES_ENABLE: "false" 

  HOOK_METHOD: "syscall" 

  KERNEL_PATCH: "false" 

  KPM_ENABLE: "false" 
  KPM_INLINE: "false" 
  KPM_KPATCH_NEXT: "false" 
  KPM_PATCH_SOURCE: "" 

  BASEBAND_GUARD_ENABLE: "false" 
  BASEBAND_GUARD_BOOT: "false" 

  GENERATE_DTB: "false" 
  GENERATE_CHIP: "qcom" 

  BUILD_DEBUGGER: "false" 
  SKIP_PATCH: "false" 

  BUILD_OTHER_CONFIG: "false" 
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false" 

jobs:
  build-kernel:
    name: Google Pixel 4a (Stock A13 + ReSukiSU)
    runs-on: ubuntu-latest
    # This forces GitHub to load a clean Ubuntu 20.04 environment inside the modern runner
    container:
      image: ubuntu:20.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      # Required inside containers to prevent root ownership permission check blocks
      - name: 🛠️ Configure Git Safe Directory
        run: |
          git config --global --add safe.directory /__w/NonGKI_Kernel_Build_2nd/NonGKI_Kernel_Build_2nd
          git config --global --add safe.directory /__w/NonGKI_Kernel_Build_2nd/NonGKI_Kernel_Build_2nd/device_kernel
        shell: bash

      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          # ReSukiSU manual hook fail-safe
          if ! grep -q "ksu_handle_execveat" fs/exec.c; then
            echo "[+] Injecting missing ksu_handle_execveat hook into fs/exec.c..."
            sed -i '/static int do_execveat_common/i\#ifdef CONFIG_KSU\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n#endif\n' fs/exec.c
            sed -i '/if (IS_ERR(filename))/i\#ifdef CONFIG_KSU\n\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n#endif\n' fs/exec.c
            echo "[+] Hook injected successfully."
          fi

          # Safety Net 1: Block Clang variable-sized array strictness errors
          echo "[+] Patching cgroup-defs.h to ignore variable-sized type errors..."
          sed -i '1i #pragma clang diagnostic ignored "-Wgnu-variable-sized-type-not-at-end"' include/linux/cgroup-defs.h

          # Safety Net 2: Disable problematic 32-bit legacy VDSO to prevent assembler crashes
          echo "[+] Disabling problematic 32-bit VDSO..."
          sed -i 's/CONFIG_VDSO32=y/# CONFIG_VDSO32 is not set/g' arch/arm64/configs/sunfish_defconfig
          sed -i 's/CONFIG_COMPAT_VDSO=y/# CONFIG_COMPAT_VDSO is not set/g' arch/arm64/configs/sunfish_defconfig
          echo "# CONFIG_VDSO32 is not set" >> arch/arm64/configs/sunfish_defconfig
          echo "# CONFIG_COMPAT_VDSO is not set" >> arch/arm64/configs/sunfish_defconfig

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
