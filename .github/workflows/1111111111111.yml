name: Build Google Pixel 4a (Stock A13 + ReSukiSU Only)

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - mainline

env:
  # Device env
  DEVICE_NAME : "google_pixel_4a"
  DEVICE_CODENAME : "sunfish"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf HOSTCC=clang HOSTCXX=clang++"

  # Official AOSP Pixel 4a kernel tree for Android 13 (4.14 base)
  KERNEL_SOURCE : "https://android.googlesource.com/kernel/msm"
  KERNEL_BRANCH : "android-msm-sunfish-4.14-android13"

  # Hardware-compatible compiler toolchains
  CLANG_SOURCE : "https://github.com/nduykha/kernel_samsung_sm7150/releases/download/clang/llvm.tar.xz"
  CLANG_BRANCH : ""

  GCC_GNU : true
  GCC_64_SOURCE : "https://github.com/nduykha/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.git"
  GCC_64_BRANCH : "main"
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "sunfish_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # KernelSU & ReSukiSU Integration Setup
  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""
  KERNELSU_AUTO_GET : "true" 
  KERNELSU_AUTO_FORK : "resukisu" 

  # Strictly Disabled Features
  SUSFS_ENABLE : false
  SUSFS_FIXED : false
  REKERNEL_ENABLE: "false" 
  DROIDSPACES_ENABLE: "false" 
  KERNEL_PATCH: "false" 
  KPM_ENABLE: "false" 
  KPM_INLINE: "false" 
  KPM_KPATCH_NEXT: "false" 
  BASEBAND_GUARD_ENABLE: "false" 
  BASEBAND_GUARD_BOOT: "false" 
  BUILD_OTHER_CONFIG: "false" 

  # Packaging Method
  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""
  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "stock_a13"

  # Engine configs
  PYTHON_VERSION: "3" 
  PACK_METHOD: "Anykernel3" 
  PACK_KMODULES: "false" 
  KERNELSU_METHOD: "shell" 
  HOOK_METHOD: "inline" # Fixed from syscall to inline targeting 4.14 source logic

  PATCHES_SOURCE: "" 
  PATCHES_BRANCH: "" 
  SUSFS_FOLDER_FIXED: "" 
  SUSFS_PATCH_FIXED: "" 
  KPM_PATCH_SOURCE: "" 

  GENERATE_DTB: "false" 
  GENERATE_CHIP: "qcom" 
  BUILD_DEBUGGER: "false" 
  SKIP_PATCH: "false" 
  FREE_MORE_SPACE: "false" 

jobs:
  build-kernel:
    name: Google Pixel 4a (Stock + ReSukiSU)
    runs-on: ubuntu-latest 
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
